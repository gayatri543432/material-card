<div class="container">
    <div class="row">
        <div class="col-md-4 mt-5" *ngFor="let prod of productArr">
            <mat-card class="example-card h-100">
                    <mat-card-header>
                        <div mat-card-avatar class="example-header-image"></div>
                        <mat-card-title>{{prod.pname}}</mat-card-title>
                    </mat-card-header>
                    <img mat-card-image [src]="prod.img" [alt]="prod.pname">
                    <mat-card-content>
                        <p>
                        {{prod.description}}
                        </p>
                    </mat-card-content>
                    <mat-card-actions class="d-flex justify-content-between">
                        <button mat-flat-button color="primary">Edit</button>
                        <button mat-flat-button color="warn">Remove</button>
                    </mat-card-actions>
            </mat-card>

        </div>
    </div>
</div>
